<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <title>Login</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { width: 85%; max-width: 300px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #111; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #0095f6; border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Rivox</h1>
        <input type="text" id="u" placeholder="Username">
        <input type="password" id="p" placeholder="Password">
        <button class="btn" onclick="login()">Log In</button>
    </div>
    <script>
        function login() {
            if(document.getElementById('u').value === "admin" && document.getElementById('p').value === "123") {
                localStorage.setItem("isLoggedIn", "true");
                window.location.href = "home.html";
            } else { alert("Wrong details!"); }
        }
    </script>
</body>
</html>
