<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivox - Chats</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chat-list {
            padding-top: 60px;
            padding-bottom: 60px;
            background-color: #000;
            min-height: 100vh;
            color: #fff;
        }
        .chat-item {
            display: flex;
            align-items: center;
            padding: 15px;
            gap: 15px;
            border-bottom: 1px solid #1c1c1c;
            cursor: pointer;
        }
        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }
        .chat-details {
            flex: 1;
        }
        .chat-name {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }
        .chat-msg {
            font-size: 13px;
            color: #8e8e8e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-time {
            font-size: 11px;
            color: #8e8e8e;
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header class="top-header">
        <a href="home.html" style="color: #fff; font-size: 20px;"><i class="fa-solid fa-arrow-left"></i></a>
        <span style="font-weight: bold; font-size: 18px;">Messages</span>
        <i class="fa-regular fa-pen-to-square" style="font-size: 20px;"></i>
    </header>

    <!-- Chat List -->
    <main class="chat-list">
        <div class="chat-item">
            <img src="https://picsum.photos/id/1025/50/50" alt="user" class="chat-avatar">
            <div class="chat-details">
                <div class="chat-name">alex_rivox</div>
                <div class="chat-msg">Arre bhai! JavaScript wala code mast chal gaya...</div>
            </div>
            <div class="chat-time">Active 1m ago</div>
        </div>
        <div class="chat-item">
            <img src="https://picsum.photos/id/1012/50/50" alt="user" class="chat-avatar">
            <div class="chat-details">
                <div class="chat-name">ocean_drive</div>
                <div class="chat-msg">Sent a reel by alex_rivox</div>
            </div>
            <div class="chat-time">2h ago</div>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav" style="position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 15px 0; background-color: #000; border-top: 1px solid #262626; font-size: 20px;">
        <a href="home.html" style="color: #8e8e8e;"><i class="fa-solid fa-house"></i></a>
        <a href="reels.html" style="color: #8e8e8e;"><i class="fa-solid fa-clapperboard"></i></a>
        <a href="upload.html" style="color: #8e8e8e;"><i class="fa-solid fa-square-plus"></i></a>
        <a href="profile.html" style="color: #8e8e8e;"><i class="fa-solid fa-user"></i></a>
    </nav>

</body>
</html>
