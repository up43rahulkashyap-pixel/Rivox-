<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivox - Chats</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; padding-bottom: 70px; }
        
        /* Fixed Header */
        .top-header { 
            position: fixed; top: 0; width: 100%; height: 60px; background: #000; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 15px; border-bottom: 1px solid #222; z-index: 100;
        }

        .chat-list { padding-top: 70px; min-height: 100vh; }
        .chat-item { display: flex; align-items: center; padding: 15px; gap: 15px; border-bottom: 1px solid #1c1c1c; }
        .chat-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: #333; }
        .chat-details { flex: 1; }
        .chat-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .chat-msg { font-size: 13px; color: #8e8e8e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-time { font-size: 11px; color: #8e8e8e; }
    </style>
</head>
<body>

    <!-- Fixed Header -->
    <header class="top-header">
        <a href="feed_new.html" style="color: #fff; font-size: 20px;"><i class="fa-solid fa-arrow-left"></i></a>
        <span style="font-weight: bold; font-size: 18px;">Messages</span>
        <i class="fa-regular fa-pen-to-square" style="font-size: 20px;"></i>
    </header>

    <!-- Chat List -->
    <main class="chat-list">
        <div class="chat-item">
            <img src="https://picsum.photos/id/1025/50/50" alt="user" class="chat-avatar">
            <div class="chat-details">
                <div class="chat-name">alex_rivox</div>
                <div class="chat-msg">Arre bhai! JavaScript wala code mast chal gaya...</div>
            </div>
            <div class="chat-time">Active 1m ago</div>
        </div>
        <div class="chat-item">
            <img src="https://picsum.photos/id/1012/50/50" alt="user" class="chat-avatar">
            <div class="chat-details">
                <div class="chat-name">ocean_drive</div>
                <div class="chat-msg">Sent a reel by alex_rivox</div>
            </div>
            <div class="chat-time">2h ago</div>
        </div>
    </main>

    <!-- Master Footer -->
    <nav style="position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 99999;">
        <a href="feed_new.html" style="text-decoration: none; font-size: 28px;">🏠</a>
        <a href="reels.html" style="text-decoration: none; font-size: 28px;">♣️</a>
        <a href="upload.html" style="text-decoration: none; font-size: 28px;">➕</a>
        <a href="chat.html" style="text-decoration: none; font-size: 28px;">➭</a>
        <a href="new_profile.html" style="text-decoration: none; font-size: 28px;">●</a>
    </nav>

</body>
</html>
