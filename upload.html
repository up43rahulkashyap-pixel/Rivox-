<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivox - Create Post</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; padding-bottom: 70px; }
        
        /* Fixed Header */
        .top-header { 
            position: fixed; top: 0; width: 100%; height: 60px; background: #000; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 15px; border-bottom: 1px solid #222; z-index: 100;
        }

        .upload-container {
            padding-top: 80px; padding-left: 20px; padding-right: 20px;
            display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        .upload-box {
            width: 100%; aspect-ratio: 1/1; border: 2px dashed #262626;
            border-radius: 12px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 10px;
            color: #8e8e8e; cursor: pointer;
        }
        .upload-box i { font-size: 40px; }
        .caption-input {
            width: 100%; background-color: #121212; border: 1px solid #262626;
            border-radius: 8px; padding: 12px; color: #fff; font-size: 14px; resize: none;
        }
        .share-btn {
            width: 100%; background-color: #0095f6; color: #fff; border: none;
            padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Fixed Header -->
    <header class="top-header">
        <a href="feed_new.html" style="color: #fff; text-decoration: none; font-size: 20px;"><i class="fa-solid fa-arrow-left"></i></a>
        <span style="font-weight: bold; font-size: 18px;">New Post</span>
        <span style="color: #0095f6; font-weight: 600; cursor: pointer;">Share</span>
    </header>

    <!-- Main Form -->
    <main class="upload-container">
        <div class="upload-box">
            <i class="fa-regular fa-images"></i>
            <span>Select from Gallery</span>
        </div>
        <textarea class="caption-input" rows="4" placeholder="Write a caption..."></textarea>
        <button class="share-btn" onclick="alert('Post Shared successfully! 🚀'); window.location.href='feed_new.html';">Share Post</button>
    </main>

    <!-- Master Footer -->
    <nav style="position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 99999;">
        <a href="feed_new.html" style="text-decoration: none; font-size: 28px;">🏠</a>
        <a href="reels.html" style="text-decoration: none; font-size: 28px;">♣️</a>
        <a href="upload.html" style="text-decoration: none; font-size: 28px;">➕</a>
        <a href="chat.html" style="text-decoration: none; font-size: 28px;">➭</a>
        <a href="new_profile.html" style="text-decoration: none; font-size: 28px;">●</a>
    </nav>

</body>
</html>
