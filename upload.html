<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivox - Create Post</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .upload-container {
            padding: 80px 20px 20px 20px;
            background-color: #000;
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .upload-box {
            width: 100%;
            aspect-ratio: 1/1;
            border: 2px dashed #262626;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: #8e8e8e;
            cursor: pointer;
        }
        .upload-box i { font-size: 40px; }
        .caption-input {
            width: 100%;
            background-color: #121212;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            resize: none;
        }
        .share-btn {
            width: 100%;
            background-color: #0095f6;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header class="top-header">
        <a href="home.html" style="color: #fff; font-size: 20px;"><i class="fa-solid fa-arrow-left"></i></a>
        <span style="font-weight: bold; font-size: 18px;">New Post</span>
        <span style="color: #0095f6; font-weight: 600; cursor: pointer;">Share</span>
    </header>

    <!-- Main Form -->
    <main class="upload-container">
        <div class="upload-box">
            <i class="fa-regular fa-images"></i>
            <span>Select from Gallery</span>
        </div>
        <textarea class="caption-input" rows="4" placeholder="Write a caption..."></textarea>
        <button class="share-btn" onclick="alert('Post Shared successfully! 🚀'); window.location.href='home.html';">Share Post</button>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav" style="position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 15px 0; background-color: #000; border-top: 1px solid #262626; font-size: 20px;">
        <a href="home.html" style="color: #8e8e8e;"><i class="fa-solid fa-house"></i></a>
        <a href="reels.html" style="color: #8e8e8e;"><i class="fa-solid fa-clapperboard"></i></a>
        <a href="upload.html" style="color: #fff;"><i class="fa-solid fa-square-plus"></i></a>
        <a href="profile.html" style="color: #8e8e8e;"><i class="fa-solid fa-user"></i></a>
    </nav>

</body>
</html>
