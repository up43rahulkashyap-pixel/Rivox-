<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivox - Create Post</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: sans-serif; }
        
        /* Header Fix */
        .top-header { 
            position: fixed; top: 0; width: 100%; height: 50px; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 15px; border-bottom: 1px solid #262626; box-sizing: border-box; background: #000; z-index: 10;
        }

        .upload-container {
            padding: 70px 20px 80px 20px; /* Padding for Header and Footer */
            display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        
        .upload-box {
            width: 100%; aspect-ratio: 1/1; border: 2px dashed #262626;
            border-radius: 12px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 10px; color: #8e8e8e;
        }
        
        .caption-input {
            width: 100%; background-color: #121212; border: 1px solid #262626;
            border-radius: 8px; padding: 12px; color: #fff; font-size: 14px;
            resize: none; box-sizing: border-box;
        }
        
        .share-btn {
            width: 100%; background-color: #0095f6; color: #fff; border: none;
            padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }

        /* Bottom Nav Fix */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; display: flex; 
            justify-content: space-around; padding: 15px 0; background-color: #000; 
            border-top: 1px solid #262626; font-size: 20px; z-index: 10;
        }
    </style>
</head>
<body>

    <header class="top-header">
        <a href="home.html" style="color: #fff; text-decoration:none;"><i class="fa-solid fa-arrow-left"></i></a>
        <span style="font-weight: bold;">New Post</span>
        <span style="color: #0095f6; font-weight: 600;">Share</span>
    </header>

    <main class="upload-container">
        <div class="upload-box">
            <i class="fa-regular fa-images" style="font-size: 40px;"></i>
            <span>Select from Gallery</span>
        </div>
        <textarea class="caption-input" rows="4" placeholder="Write a caption..."></textarea>
        <button class="share-btn" onclick="alert('Post Shared successfully! 🚀'); window.location.href='home.html';">Share Post</button>
    </main>

    <nav class="bottom-nav">
        <a href="home.html" style="color: #8e8e8e;"><i class="fa-solid fa-house"></i></a>
        <a href="reels.html" style="color: #8e8e8e;"><i class="fa-solid fa-clapperboard"></i></a>
        <a href="upload.html" style="color: #fff;"><i class="fa-solid fa-square-plus"></i></a>
        <a href="profile.html" style="color: #8e8e8e;"><i class="fa-solid fa-user"></i></a>
    </nav>

</body>
</html>
