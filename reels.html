<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivox - Reels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
        .reels-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .reels-container::-webkit-scrollbar { display: none; }
        .reel-video-container { position: relative; width: 100%; height: 100vh; scroll-snap-align: start; }
        .reel-video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Actions Section */
        .reel-actions {
            position: absolute; bottom: 80px; right: 15px;
            display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 10;
        }
        .reel-action-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 26px; color: white; cursor: pointer;
        }
        .reel-action-item span { font-size: 12px; margin-top: 5px; font-weight: 600; }
        
        .reel-info { position: absolute; bottom: 80px; left: 15px; z-index: 10; }
    </style>
</head>
<body>

    <main class="reels-container">
        <section class="reel-video-container">
            <video class="reel-video" src="https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-4710-large.mp4" loop autoplay muted playsinline></video>
            
            <div class="reel-actions">
                <div class="reel-action-item"><i class="fa-regular fa-heart"></i><span>45.2K</span></div>
                <div class="reel-action-item"><i class="fa-regular fa-comment"></i><span>1,120</span></div>
                <div class="reel-action-item"><i class="fa-regular fa-bookmark"></i></div>
                <div class="reel-action-item"><i class="fa-regular fa-paper-plane"></i></div>
            </div>

            <div class="reel-info">
                <strong>alex_rivox</strong>
                <p>Beautiful nature vibes! 🍂</p>
            </div>
        </section>
    </main>
<nav style="position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 99999;">

</nav>


</body>
</html>
