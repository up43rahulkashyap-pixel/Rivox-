<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivox Login</title>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            width: 85%; 
            max-width: 320px; 
            text-align: center; 
        }
        h1 { font-family: cursive; margin-bottom: 30px; letter-spacing: 1px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            background: #121212; 
            border: 1px solid #333; 
            color: white; 
            border-radius: 5px; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 15px;
            background: #0095f6; 
            border: none; 
            color: white; 
            border-radius: 5px; 
            font-weight: bold; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>Rivox</h1>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Log In</button>
    </div>

    <script>
        function login() {
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;

            // Username: admin, Password: 123
            if(u === "admin" && p === "123") {
                // Yahan 'home.html' likha hai, toh aapki main feed file ka naam 'home.html' hona chahiye
                window.location.href = "home.html";
            } else {
                alert("Galat username ya password!");
            }
        }
    </script>
</body>
</html>
