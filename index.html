<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rivox Login</title>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            width: 80%; 
            max-width: 300px; 
            text-align: center; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            background: #222; 
            border: 1px solid #444; 
            color: white; 
            border-radius: 8px; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #0095f6; 
            border: none; 
            color: white; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>Rivox</h1>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Log In</button>
    </div>

    <script>
        function login() {
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;

            // Username aur Password check
            if(u === "admin" && p === "123") {
                window.location.href = "feed.html";
            } else {
                alert("Galat username ya password!");
            }
        }
    </script>
</body>
</html>
